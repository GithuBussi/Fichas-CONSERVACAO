<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Personagem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --c-for: #e25c5c; --c-des: #7ed957; --c-con: #ff9f43;
  --c-sab: #4dd0e1; --c-int: #4a8cff; --c-car: #d4c026; --c-sp: #a55cff;
  --tab-principal: #6c8cff; --tab-habilidades: #ff9f43;
  --tab-tecnicas: #4dd0e1; --tab-inventario: #7ed957; --tab-perfil: #d4c026;
  --tab-diario: #e25ce0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #141418;
  color: #f0f0f0;
  min-height: 100vh;
  padding: 12px;
  display: flex;
  justify-content: center;
}
.card {
  background: #22222c;
  border-radius: 14px;
  padding: 16px;
  max-width: 580px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
}

/* TABS */
.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  border-bottom: 1px solid #333;
  padding-bottom: 6px;
}
.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: #888;
  padding: 8px 4px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  letter-spacing: 0.3px;
  transition: color .15s;
}
.tab-btn .ti { font-size: 14px; }
.tab-btn[data-tab="principal"].active  { color: var(--tab-principal);  border-color: var(--tab-principal); }
.tab-btn[data-tab="habilidades"].active{ color: var(--tab-habilidades); border-color: var(--tab-habilidades); }
.tab-btn[data-tab="tecnicas"].active   { color: var(--tab-tecnicas);   border-color: var(--tab-tecnicas); }
.tab-btn[data-tab="inventario"].active { color: var(--tab-inventario);  border-color: var(--tab-inventario); }
.tab-btn[data-tab="perfil"].active     { color: var(--tab-perfil);     border-color: var(--tab-perfil); }
.tab-btn[data-tab="diario"].active     { color: var(--tab-diario);     border-color: var(--tab-diario); }
.tab-content { display: none; flex-direction: column; gap: 18px; }
.tab-content.active { display: flex; }

/* Tab backgrounds */
.tab-content[data-tab="principal"]  { --tab-bg: rgba(108,140,255,0.03); }
.tab-content[data-tab="habilidades"]{ --tab-bg: rgba(255,159,67,0.03); }
.tab-content[data-tab="tecnicas"]   { --tab-bg: rgba(77,208,225,0.03); }
.tab-content[data-tab="inventario"] { --tab-bg: rgba(126,217,87,0.03); }
.tab-content[data-tab="perfil"]     { --tab-bg: rgba(212,192,38,0.03); }
.tab-content[data-tab="diario"]     { --tab-bg: rgba(226,92,224,0.03); }
.tab-content.active { background: var(--tab-bg); border-radius: 8px; padding: 4px 2px; }

/* Tech tab extras */
.tech-sp-indicator {
  position: absolute; top: 8px; right: 8px;
  background: #18181f; border: 1px solid var(--c-sp);
  color: var(--c-sp); font-weight: 800; font-size: 12px;
  border-radius: 8px; padding: 5px 10px;
  box-shadow: 0 0 10px rgba(165,92,255,0.3);
}
.tab-content[data-tab="tecnicas"] { position: relative; }
.field-with-total { display: flex; align-items: flex-end; gap: 10px; }
.tech-skill-total {
  font-weight: 900; font-size: 22px; color: #4dd0e1;
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px;
  padding: 4px 14px; min-width: 56px; text-align: center;
  text-shadow: 0 0 10px rgba(77,208,225,0.4);
}

/* SECTION HEADERS */
h2 {
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  border-bottom: 2px solid rgba(255,255,255,0.12);
  padding-bottom: 6px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 7px;
}
h2 .ico { font-size: 15px; opacity: 0.7; }

/* INPUTS */
input[type="text"], textarea, input[type="number"], select {
  background: #18181f;
  border: 1px solid #3a3a4a;
  color: #f0f0f0;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color .15s;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: #6c8cff; }
input[type="text"] { width: 100%; }
input[type="number"] { width: 68px; text-align: center; }
select { font-size: 13px; }
textarea { width: 100%; resize: vertical; font-size: 13px; }

label.title { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: #ccc; }
label.sub   { font-size: 11px; color: #888; display: block; margin-bottom: 3px; }
.field label { font-size: 11px; color: #888; display: block; margin-bottom: 4px; }

/* RANGE */
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 6px; border-radius: 4px;
  background: #333; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #6c8cff; cursor: pointer;
  box-shadow: 0 0 6px rgba(108,140,255,0.5);
}
.row { display: flex; align-items: center; gap: 10px; }
.row input[type="range"] { flex: 1; }
.out { min-width: 64px; text-align: right; font-weight: 700; font-size: 15px; }

/* BARS */
.bar-bg {
  height: 14px; border-radius: 7px;
  background: #18181f; overflow: hidden; margin-top: 6px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.6);
}
.bar-fill { height: 100%; transition: width .2s, background .3s; }
.hp-fill { background: linear-gradient(90deg, #4caf50, #8bc34a); }
.hp-fill.warn { background: linear-gradient(90deg, #c68f00, #ffd54f); }
.hp-fill.crit { background: linear-gradient(90deg, #a01010, #e24b4a); animation: glow-pulse 1.1s infinite; }
.sp-fill { background: linear-gradient(90deg, #6a28b0, var(--c-sp)); }
.sp-fill.warn { background: linear-gradient(90deg, #8a6000, #d4a017); }
.sp-fill.crit { background: linear-gradient(90deg, #a01010, #e24b4a); animation: glow-pulse 1.1s infinite; }
@keyframes glow-pulse {
  0%,100% { box-shadow: 0 0 6px rgba(226,75,74,0.5); }
  50%      { box-shadow: 0 0 18px rgba(226,75,74,1); }
}

/* SHAKE */
@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-6px); }
  40%    { transform: translateX(6px); }
  60%    { transform: translateX(-4px); }
  80%    { transform: translateX(4px); }
}
.shake { animation: shake .4s ease; }

/* QUICK DAMAGE/HEAL */
.quick-dmg {
  display: flex; align-items: center; gap: 8px; margin-top: 8px;
  background: #18181f; border: 1px solid #3a3a4a;
  border-radius: 8px; padding: 8px 10px;
}
.quick-dmg input { width: 60px; }
.quick-dmg label { font-size: 12px; color: #888; flex: 1; }
.q-btn {
  background: transparent;
  border: 1px solid #555;
  color: #eee;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.q-btn.dmg { border-color: #e24b4a; color: #e24b4a; }
.q-btn.heal { border-color: #4caf50; color: #4caf50; }
.q-btn.sp-use { border-color: var(--c-sp); color: var(--c-sp); }
.q-btn.sp-heal { border-color: var(--c-des); color: var(--c-des); }

/* MAXROW / DICE */
.maxrow { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #888; }
.dice-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: #888; }
.dice-row input[type="text"] { width: 70px; padding: 5px 8px; font-size: 12px; }

/* ATTR GRID */
.attr-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.attr-box {
  background: #18181f;
  border: 1px solid #3a3a4a;
  border-left: 4px solid var(--ac, #444);
  border-radius: 8px; padding: 9px; text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.attr-box label { font-size: 10px; color: #888; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
.attr-box input { width: 100%; text-align: center; font-size: 20px; font-weight: 800; color: var(--ac, #f0f0f0); border: none; background: transparent; }
.attr-for { --ac: var(--c-for); } .attr-des { --ac: var(--c-des); } .attr-con { --ac: var(--c-con); }
.attr-sab { --ac: var(--c-sab); } .attr-int { --ac: var(--c-int); } .attr-car { --ac: var(--c-car); }

/* COMBAT */
.combat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.combat-box {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px;
  padding: 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.combat-box label { font-size: 12px; color: #ccc; }
.combat-box .unit { font-size: 11px; color: #888; }

/* CONDITION/EMOTION SLIDERS */
.cond-slider-wrap { position: relative; }

/* STATUS */
.status-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.status-box label { font-size: 10px; color: #888; display: block; margin-bottom: 3px; text-transform: uppercase; }
.status-box textarea { min-height: 55px; font-size: 12px; }

/* DEATH */
.death-row { display: flex; gap: 16px; justify-content: center; padding: 10px 0; }
.death-dot {
  width: 58px; height: 58px; border-radius: 50%;
  border: 3px solid #444; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 26px; font-weight: 900; color: transparent;
  background: #18181f; transition: all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.death-dot.marked {
  border-color: #e24b4a; color: #e24b4a;
  background: rgba(226,75,74,0.12);
  transform: scale(1.15);
  box-shadow: 0 0 18px rgba(226,75,74,0.7);
}
#deathMsg {
  text-align: center; font-size: 12px; font-weight: 800; color: #e24b4a;
  visibility: hidden; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px;
}

/* DEATH OVERLAY */
#deathOverlay {
  position: fixed; inset: 0; pointer-events: none;
  z-index: 9999; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); transition: background 1.2s ease;
  flex-direction: column; gap: 16px;
}
#deathOverlay.d3 { background: rgba(0,0,0,0.88); pointer-events: all; }
#deathTitle {
  font-size: 32px; font-weight: 900; color: #e24b4a; letter-spacing: 4px;
  text-transform: uppercase; text-shadow: 0 0 30px rgba(226,75,74,0.8);
  opacity: 0; transition: opacity 1s ease 0.5s; text-align: center;
}
#deathOverlay.d3 #deathTitle { opacity: 1; }
#deathSubtitle {
  font-size: 16px; color: #aaa; letter-spacing: 2px;
  opacity: 0; transition: opacity 1s ease 1s;
}
#deathOverlay.d3 #deathSubtitle { opacity: 1; }
#deathUndoBtn {
  background: #e24b4a; color: #fff; border: none;
  border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 700;
  cursor: pointer; opacity: 0; transition: opacity 1s ease 2s; pointer-events: none;
  margin-top: 8px;
}
#deathOverlay.d3 #deathUndoBtn { opacity: 1; pointer-events: all; }

/* SKILLS */
.skill-table { display: flex; flex-direction: column; gap: 4px; }
.skill-header {
  display: grid; grid-template-columns: 52px 1fr 80px 90px 50px 50px;
  gap: 5px; align-items: center; font-size: 9px; color: #666;
  text-transform: uppercase; border-bottom: 1px solid #333; padding: 0 6px 4px;
}
.skill-row {
  display: grid; grid-template-columns: 52px 1fr 80px 90px 50px 50px;
  gap: 5px; align-items: center; padding: 4px 6px;
  border-bottom: 1px solid #2a2a35;
  border-left: 3px solid var(--sc, #444); border-radius: 3px;
}
.skill-row:hover { background: rgba(255,255,255,0.02); }
.skill-total { font-weight: 800; font-size: 15px; color: var(--sc, #9fb4ff); text-align: center; }
.skill-name { font-size: 12px; }
.skill-row select, .skill-row input { width: 100%; padding: 3px 5px; font-size: 11px; }

/* DEFENSES */
.def-table { display: flex; flex-direction: column; gap: 10px; }
.def-card {
  background: #18181f; border: 1px solid #3a3a4a;
  border-left: 4px solid var(--dc, #6c8cff);
  border-radius: 9px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.def-card-top { display: flex; align-items: center; gap: 10px; }
.def-name { font-size: 14px; font-weight: 800; flex: 1; }
.def-total-box {
  font-weight: 900; font-size: 28px; color: var(--dc, #9fb4ff);
  background: rgba(255,255,255,0.04); border-radius: 8px;
  padding: 2px 14px; min-width: 64px; text-align: center;
  text-shadow: 0 0 12px var(--dc, rgba(108,140,255,0.4));
}
.def-order-btns { display: flex; flex-direction: column; gap: 2px; }
.def-order-btns button {
  background: transparent; border: 1px solid #444; color: #888;
  border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; align-self: stretch;
}
.def-fields { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; font-size: 11px; color: #888; }
.def-fields .field label { display: block; margin-bottom: 3px; }
.def-fields select, .def-fields input { width: 100%; padding: 4px 6px; font-size: 12px; }
.def-armor-input { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: #888; }
.def-armor-input input { width: 70px; padding: 4px 6px; font-size: 12px; }
.dmg-limit-box {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px;
  padding: 10px; display: flex; align-items: center; justify-content: space-between;
  font-size: 12px; color: #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
#dmgLimitOut { font-weight: 800; font-size: 18px; color: #9fb4ff; }

/* RESISTENCIAS */
.res-table { display: flex; flex-direction: column; gap: 4px; }
.res-header {
  display: grid; grid-template-columns: 1.4fr 0.7fr 1fr 36px;
  gap: 6px; align-items: center; font-size: 9px; color: #666;
  text-transform: uppercase; border-bottom: 1px solid #333; padding: 0 6px 4px;
}
.res-row {
  display: grid; grid-template-columns: 1.4fr 0.7fr 1fr 36px;
  gap: 6px; align-items: center; padding: 4px 6px;
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 6px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.res-row select, .res-row input { width: 100%; padding: 4px 6px; font-size: 12px; }
.res-row .remove-btn { padding: 4px 6px; font-size: 11px; align-self: center; }

/* DAMAGE CALC INFO */
.dmg-calc-info {
  font-size: 11px; color: #9fb4ff; margin-top: 6px; min-height: 14px;
}

/* OPEN WOUND */
.open-wound-label {
  display: flex; align-items: center; gap: 6px; margin-top: 8px;
  font-size: 12px; color: #e24b4a; font-weight: 700; cursor: pointer;
}
.open-wound-label input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: #e24b4a; cursor: pointer;
}

/* SESSION TIMER */
.session-box {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px;
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.session-time { font-size: 22px; font-weight: 800; color: #6c8cff; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.session-btns { display: flex; gap: 6px; }
.s-btn {
  background: transparent; border: 1px solid #555; color: #ccc;
  border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.s-btn.active { border-color: #6c8cff; color: #6c8cff; }

/* ABILITIES / TECHNIQUES / ITEMS */
.item-list { display: flex; flex-direction: column; gap: 8px; }

/* Collapsible card */
.coll-card {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 9px;
  overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  cursor: default;
}
.coll-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  cursor: pointer; user-select: none;
}
.coll-header:hover { background: rgba(255,255,255,0.03); }
.coll-chevron { font-size: 11px; color: #888; transition: transform .2s; }
.coll-card.open .coll-chevron { transform: rotate(90deg); }
.coll-name { font-weight: 700; font-size: 14px; flex: 1; }
.coll-badge {
  font-size: 11px; color: #888; background: #2a2a38;
  border-radius: 4px; padding: 2px 7px; white-space: nowrap;
}
.coll-body { padding: 0 12px 12px; display: none; flex-direction: column; gap: 8px; }
.coll-card.open .coll-body { display: flex; }
.coll-row { display: flex; gap: 8px; flex-wrap: wrap; }
.coll-row > div { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 85px; }
.drag-handle {
  color: #555; font-size: 16px; cursor: grab; padding: 0 4px;
  display: flex; align-items: center; touch-action: none;
}
.drag-handle:active { cursor: grabbing; }
.coll-card.dragging { opacity: 0.5; border: 2px dashed #6c8cff; }

.remove-btn {
  background: transparent; border: 1px solid #e24b4a; color: #e24b4a;
  border-radius: 6px; padding: 4px 10px; font-size: 11px; cursor: pointer; align-self: flex-end;
}
.add-btn {
  background: transparent; border: 1px dashed #555; color: #888;
  border-radius: 8px; padding: 10px; font-size: 12px; font-weight: 600;
  cursor: pointer; text-align: center; transition: border-color .15s, color .15s;
}
.add-btn:hover { border-color: #6c8cff; color: #9fb4ff; }

/* SPECIAL ABILITY */
.special-box {
  background: #18181f; border: 2px solid #6c8cff; border-radius: 10px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 0 20px rgba(108,140,255,0.15);
}

/* WEAPONS / ARMOR */
.weapon-card { border-left: 4px solid var(--c-for); }
.armor-card  { border-left: 4px solid var(--c-sab); }

/* INVENTORY */
.load-box { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.load-box .field label { font-size: 11px; color: #888; margin-bottom: 4px; display: block; }
.load-readout {
  display: block; font-size: 18px; font-weight: 800; color: #9fb4ff;
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px;
  padding: 8px 10px; text-align: center;
}
.load-readout.over { color: #e24b4a; border-color: #e24b4a; }

/* PROFILE */
.id-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.id-grid .full { grid-column: 1/-1; }
.profile-top { display: flex; gap: 12px; align-items: flex-start; }
.photo-box {
  width: 84px; height: 84px; min-width: 84px; border-radius: 10px;
  background: #18181f; border: 2px dashed #3a3a4a;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden; position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.photo-box img { width: 100%; height: 100%; object-fit: cover; }
.photo-box #photoPlaceholder { font-size: 11px; color: #666; text-align: center; }
.photo-box:hover { border-color: #6c8cff; }
.desc-field textarea { font-size: 13px; }
.desc-field label { margin-bottom: 4px; }

/* FAMA */
.fama-bar {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 8px; padding: 10px 12px;
}
.fama-label { font-size: 12px; color: #d4c026; font-weight: 700; margin-top: 6px; }
.fama-track {
  display: flex; gap: 4px; margin-top: 6px;
}
.fama-pip {
  flex: 1; height: 8px; border-radius: 4px; background: #333;
  transition: background .3s;
}
.fama-pip.active { background: #d4c026; }

/* CONTACTS */
.contact-toolbar { display: flex; gap: 8px; }
.contact-toolbar input { flex: 2; }
.contact-toolbar select { flex: 1; }
.contact-card-header { display: flex; align-items: center; gap: 8px; }
.contact-category-badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  background: #2a2a38; color: #9fb4ff; border-radius: 4px; padding: 2px 7px;
}

/* DIARY */
.diary-new {
  background: #18181f; border: 1px solid #3a3a4a; border-radius: 9px;
  padding: 12px; display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.diary-entry {
